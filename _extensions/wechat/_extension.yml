title: "普癌新声 WeChat HTML"
author: "普癌新声"
version: 1.1.2
quarto-required: ">=1.4.0"
contributes:
  # Register the bundled brand as a Quarto brand extension. This makes its
  # Google font declarations and Bootstrap palette part of the HTML build,
  # rather than merely exposing a `brand:` metadata path.
  brand: brand.yml
  # The extension directory is named `wechat`, so this HTML-derived format is
  # selected as `wechat-html` in a document or project.
  formats:
    html:
      theme:
        light:
          - cosmo
          - brand
        dark:
          - cosmo
          - brand
          - themes/dark.scss
      css: styles.css
      filters:
        - filters/category-count.lua
        - filters/article-theme.lua
      toc: true
      toc-title: "主要内容"
      toc-location: right
      respect-user-color-scheme: true
      smooth-scroll: true
      link-external-newwindow: true
  filters:
    - filters/category-count.lua
    - filters/article-theme.lua
