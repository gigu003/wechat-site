<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>html,body{width:1440px;height:810px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 30px}.note{font-size:20px;color:#64736b}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{height:220px;padding:23px 25px}.icon{font-size:16px;font-family:"SF Mono",Menlo,monospace;color:#19704f;letter-spacing:1px}.h{font-size:29px;font-weight:850;margin:9px 0}.txt{font-size:19px;line-height:1.55;color:#53625a}.card:nth-child(2),.card:nth-child(5){border-color:#e7c18e}.card:nth-child(3){border-color:#e5aa93}</style></head><body><div class="canvas"><div class="grid"></div><div class="content"><div class="kicker">02 / WHOLE BODY</div><div class="head"><div class="title">受影响的不只是<span class="accent">肝脏</span></div><div class="note">急性影响与长期伤害并存</div></div><div class="cards"><div class="panel card"><div class="icon">BRAIN</div><div class="h">脑与神经</div><div class="txt">判断、反应和协调受损<br>长期大量饮酒可影响认知和周围神经</div></div><div class="panel card"><div class="icon">HEART</div><div class="h">心血管</div><div class="txt">高血压、心律失常<br>长期大量饮酒可损伤心肌</div></div><div class="panel card"><div class="icon">LIVER</div><div class="h">肝脏</div><div class="txt">脂肪变、炎症、纤维化<br>肝硬化及肝癌风险升高</div></div><div class="panel card"><div class="icon">GI · PANCREAS</div><div class="h">胃肠与胰腺</div><div class="txt">黏膜损伤和炎症<br>可发生急性或慢性胰腺炎</div></div><div class="panel card"><div class="icon">IMMUNE</div><div class="h">免疫系统</div><div class="txt">影响抗感染能力<br>妨碍组织修复并促进炎症</div></div><div class="panel card"><div class="icon">CANCER</div><div class="h">至少七类癌症</div><div class="txt">口咽喉、食管、肝、结直肠<br>以及女性乳腺癌</div></div></div><div class="footer"><span>风险大小取决于总量、频率、饮酒模式和个人情况</span><span class="source">来源：WHO · NCI · NIAAA</span></div></div></div></body></html>
