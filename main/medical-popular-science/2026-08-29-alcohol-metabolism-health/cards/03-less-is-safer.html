<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>html,body{width:1440px;height:810px}.layout{display:grid;grid-template-columns:1.25fr .75fr;gap:28px;margin-top:30px}.left,.right{padding:34px}.risk-title{font-size:27px;font-weight:800;margin-bottom:30px}.scale{display:flex;align-items:center;gap:18px;margin:24px 0}.bar{height:42px;border-radius:12px}.b0{width:90px;background:#b9ddc7}.b1{width:210px;background:#e8c278}.b2{width:350px;background:#d86a45}.label{font-size:21px;font-weight:700}.explain{margin-top:32px;padding-top:24px;border-top:1px dashed #bcd2c3;font-size:21px;line-height:1.7;color:#4f6057}.right .h{font-size:28px;font-weight:850;margin-bottom:22px}.myth{padding:15px 0;border-bottom:1px solid #dfebe1;font-size:20px;line-height:1.55}.cross{color:#c85c36;font-weight:900;margin-right:8px}.answer{color:#19704f;font-weight:800}</style></head><body><div class="canvas"><div class="grid"></div><div class="content"><div class="kicker">03 / RISK</div><div class="title">“没有安全剂量”不等于<span class="accent">必然患病</span></div><div class="layout"><div class="panel left"><div class="risk-title">它说的是概率：暴露越多，风险通常越高</div><div class="scale"><div class="bar b0"></div><div class="label">不饮酒：避免酒精直接风险</div></div><div class="scale"><div class="bar b1"></div><div class="label">饮酒较少：风险较低，但不是零</div></div><div class="scale"><div class="bar b2"></div><div class="label">总量或单次量增加：风险上升</div></div><div class="explain">没有饮酒习惯，不必为了“护心”开始喝。<br><span class="answer">已经饮酒，减少总量和频率都有意义。</span></div></div><div class="panel right"><div class="h">三个常见误区</div><div class="myth"><span class="cross">×</span>红酒可以抵消酒精风险</div><div class="myth"><span class="cross">×</span>喝酒脸红说明代谢快</div><div class="myth"><span class="cross">×</span>咖啡或洗澡能快速醒酒</div></div></div><div class="footer"><span>低风险 ≠ 零风险；群体证据 ≠ 个体必然结局</span><span class="source">来源：WHO · NCI · NIAAA</span></div></div></div></body></html>
