<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>html,body{width:1440px;height:810px}.head{display:flex;justify-content:space-between;align-items:flex-end;margin:10px 0 45px}.note{font-size:21px;color:#64736b}.flow{display:grid;grid-template-columns:1fr 110px 1fr 110px 1fr;align-items:stretch}.box{padding:34px 30px;min-height:330px}.chem{font-family:"SF Mono",Menlo,monospace;font-size:24px;color:#6d7a73}.name{font-size:43px;font-weight:850;margin:12px 0 22px}.desc{font-size:22px;line-height:1.7;color:#526159}.bad{border-color:#e5aa93;background:#fff9f6}.bad .name{color:#b8482b}.arrow{display:flex;flex-direction:column;align-items:center;justify-content:center;color:#718078;font-size:52px}.enzyme{font-size:17px;color:#19704f;background:#ddefe4;padding:7px 10px;border-radius:10px;white-space:nowrap;margin-top:10px}</style></head><body><div class="canvas"><div class="grid"></div><div class="content"><div class="kicker">01 / METABOLISM</div><div class="head"><div class="title">身体怎样处理<span class="accent">乙醇</span></div><div class="note">主要路径发生在肝脏</div></div><div class="flow"><div class="panel box"><div class="chem">CH₃CH₂OH</div><div class="name">乙醇</div><div class="desc">进入血液并分布到全身<br>直接影响脑和其他器官</div></div><div class="arrow">→<div class="enzyme">ADH</div></div><div class="panel box bad"><div class="chem">CH₃CHO</div><div class="name">乙醛</div><div class="desc">有毒、具有致癌性<br>可损伤DNA和蛋白质</div></div><div class="arrow">→<div class="enzyme">ALDH</div></div><div class="panel box"><div class="chem">CH₃COO⁻</div><div class="name">乙酸</div><div class="desc">活性较低<br>继续分解为二氧化碳和水</div></div></div><div class="footer"><span>咖啡、洗澡不能让这条代谢路径突然加速</span><span class="source">来源：NIAAA Alcohol Metabolism</span></div></div></div></body></html>
