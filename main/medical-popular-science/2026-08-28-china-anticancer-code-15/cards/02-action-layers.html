<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:810px;overflow:hidden}body{font-family:"PingFang SC",sans-serif;background:#f2f8ef;color:#1e2a26}.canvas{width:100%;height:100%;padding:52px 72px}.kicker{font-family:"SF Mono",Menlo,monospace;color:#14604a;font-size:18px;letter-spacing:2px}.title{font-size:50px;font-weight:850;margin:12px 0 34px}.layers{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}.layer{min-height:495px;border-radius:28px;padding:32px;background:#fff;border:2px solid #c2dcc8;position:relative}.layer:before{content:"";position:absolute;left:0;right:0;top:0;height:14px;border-radius:28px 28px 0 0;background:#2d9e7a}.layer:nth-child(2):before{background:#f4c35a}.layer:nth-child(3):before{background:#e85f46}.num{font-size:67px;font-weight:900;color:#d9f0e0;line-height:1}.h{font-size:31px;font-weight:850;margin:14px 0 24px}.items{font-size:23px;line-height:1.75;color:#4f5f56}.items div{padding:8px 0 8px 34px;position:relative;border-bottom:1px dashed #d8e8dc}.items div:before{content:"✓";position:absolute;left:0;color:#2d9e7a;font-weight:900}.layer:nth-child(3) .items div:before{content:"→";color:#e85f46}.footer{display:flex;justify-content:space-between;margin-top:25px;color:#738078;font-size:17px}.strong{color:#14604a;font-weight:750}</style></head><body><div class="canvas"><div class="kicker">把守则变成行动</div><div class="title">不必一次做完15条，先分三层</div><div class="layers"><div class="layer"><div class="num">01</div><div class="h">优先减少高风险暴露</div><div class="items"><div>不吸烟，尽早戒烟</div><div>远离二手烟</div><div>避免长期高频咀嚼槟榔</div><div>核对职业致癌物防护</div></div></div><div class="layer"><div class="num">02</div><div class="h">让健康选择更省力</div><div class="items"><div>减少久坐，持续活动</div><div>调整长期饮食模式</div><div>家中保持适当通风</div><div>聚餐使用公勺公筷</div></div></div><div class="layer"><div class="num">03</div><div class="h">需要评估的事列出来</div><div class="items"><div>疫苗接种与补种</div><div>职业防护是否匹配暴露</div><div>个体癌症风险与筛查</div><div>母乳喂养支持</div></div></div></div><div class="footer"><span class="strong">从一项可持续的改变开始</span><span>群体建议 ≠ 个体诊疗方案</span></div></div></body></html>
