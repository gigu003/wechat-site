<style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:810px;overflow:hidden}body{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;background:#f2f8ef;color:#1e2a26}.canvas{width:100%;height:100%;padding:58px 70px;position:relative;display:flex;flex-direction:column;background:radial-gradient(circle at 88% 12%,#d9f0e0 0 10%,transparent 10.3%),linear-gradient(135deg,#f7fbf4,#eef7ef)}.canvas:before{content:"";position:absolute;inset:24px;border:2px solid #c2dcc8;border-radius:28px;pointer-events:none}.kicker{font:700 21px "SF Mono",Menlo,monospace;color:#2d9e7a;letter-spacing:2px;margin-bottom:16px}.title{font-size:54px;line-height:1.14;font-weight:850;letter-spacing:-1px}.title em{font-style:normal;color:#e6654b}.sub{font-size:25px;line-height:1.55;color:#5d6b62;margin-top:13px}.footer{margin-top:auto;font:600 19px "SF Mono",Menlo,monospace;color:#5d6b62}.grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}.chip{background:#fff;border:2px solid #c2dcc8;border-radius:20px;padding:19px 22px;min-height:118px;box-shadow:0 8px 0 #d9f0e0}.chip b{font-size:28px;color:#14604a;display:block;margin-bottom:6px}.chip span{font-size:20px;color:#5d6b62}.map{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:28px}.type{background:#fff;border-radius:19px;padding:19px 15px;border-top:9px solid #2d9e7a;min-height:330px;box-shadow:0 7px 0 #d9f0e0}.type:nth-child(2){border-color:#f4c35a}.type:nth-child(3){border-color:#7ab8c4}.type:nth-child(4){border-color:#e08a50}.type:nth-child(5){border-color:#ff7b5d}.type h3{font-size:27px;line-height:1.25;margin:0 0 14px}.type .signal{font-size:18px;line-height:1.5;color:#5d6b62;min-height:82px}.type .action{font-size:20px;line-height:1.5;font-weight:700;color:#14604a;border-top:1px solid #d9f0e0;padding-top:13px;margin-top:12px}.records{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:25px}.record{background:#fff;border:2px solid #c2dcc8;border-radius:22px;padding:19px 24px;display:flex;gap:18px;align-items:center;box-shadow:0 7px 0 #d9f0e0}.num{width:56px;height:56px;flex:0 0 56px;border-radius:18px;background:#2d9e7a;color:white;display:grid;place-items:center;font:800 28px "SF Mono",Menlo,monospace}.record b{display:block;font-size:27px;color:#14604a}.record span{font-size:19px;color:#5d6b62;line-height:1.45}.cover{width:1200px;height:510px}.cover .canvas{padding:54px 68px;background:linear-gradient(120deg,#f7fbf4 0 64%,#d9f0e0 64%)}.cover .canvas:after{content:"";position:absolute;width:220px;height:220px;right:77px;top:142px;border:20px solid #2d9e7a;border-radius:50%;box-shadow:44px -32px 0 -21px #ff7b5d,-45px 48px 0 -25px #f4c35a}.cover .kicker{font-size:20px}.cover .title{font-size:60px;max-width:780px;position:relative;z-index:1}.cover .sub{font-size:25px;max-width:760px;position:relative;z-index:1}.cover .footer{font-size:18px;position:relative;z-index:1}
</style>

<body>
<div class="canvas" id="canvas"></div>
<script>
const id=new URLSearchParams(location.search).get('card')||'cover';
const cards={
cover:`<div class="kicker">PUAI XINSHENG · 科研协作</div><div class="title">科研工作者如何<br>读懂<em>领导风格</em></div><div class="sub">看行为，不猜性格 · 识别信号 · 选择应对 · 保护贡献</div><div class="footer">普癌新声</div>`,
signals:`<div class="kicker">OBSERVE · 先看反复出现的行为</div><div class="title">识别领导方式的 <em>6 个维度</em></div><div class="grid6"><div class="chip"><b>目标清晰度</b><span>交付物与质量标准是否明确</span></div><div class="chip"><b>优先级稳定性</b><span>新想法是替换还是无限叠加</span></div><div class="chip"><b>决策权</b><span>哪些可自主，哪些需确认</span></div><div class="chip"><b>反馈质量</b><span>是否及时、具体并指向作品</span></div><div class="chip"><b>资源与贡献</b><span>数据、经费、署名如何分配</span></div><div class="chip"><b>异议安全</b><span>能否提问、报错、表达不同意见</span></div></div><div class="footer">看一段时间，尤其看受挫、紧急和异议出现时的行为</div>`,
map:`<div class="kicker">RESPOND · 行为模式不等于人格诊断</div><div class="title">五种模式，应对重点<em>各不相同</em></div><div class="map"><div class="type"><h3>清晰教练型</h3><div class="signal">目标清楚<br>反馈具体<br>容许报错</div><div class="action">会前一页纸<br>逐步申请自主权</div></div><div class="type"><h3>指令控制型</h3><div class="signal">方法细节被指定<br>汇报频繁<br>选择空间小</div><div class="action">提供A/B方案<br>用风险和成本沟通</div></div><div class="type"><h3>灵感跳跃型</h3><div class="signal">新方向不断出现<br>旧任务未取消<br>截止日不变</div><div class="action">继续/暂停/新增<br>让变更成本可见</div></div><div class="type"><h3>放手缺席型</h3><div class="signal">反馈无时限<br>关键时刻找不到<br>截止前才推翻</div><div class="action">写明默认规则<br>建立多导师支持</div></div><div class="type"><h3>破坏边界型</h3><div class="signal">反复贬损、威胁<br>报复或侵占贡献<br>问题超出风格匹配</div><div class="action">保存客观记录<br>咨询正式保护渠道</div></div></div><div class="footer">对普通差异调整协作；对破坏性行为优先降低人和研究的风险</div>`,
records:`<div class="kicker">TRACEABILITY · 留痕不等于对抗</div><div class="title">科研合作的 <em>4 份最小记录</em></div><div class="sub">记录事实、决定和版本，少猜测动机</div><div class="records"><div class="record"><div class="num">01</div><div><b>项目一页纸</b><span>问题 · 交付物 · 优先级 · 里程碑 · 决策人</span></div></div><div class="record"><div class="num">02</div><div><b>会议决定记录</b><span>已决定事项 · 责任人 · 截止日 · 待确认问题</span></div></div><div class="record"><div class="num">03</div><div><b>CRediT 贡献表</b><span>方法 · 数据 · 分析 · 软件 · 初稿 · 修订</span></div></div><div class="record"><div class="num">04</div><div><b>数据与代码日志</b><span>来源 · 版本 · 权限 · 脚本 · 变更 · 可复现输出</span></div></div></div><div class="footer">CRediT描述贡献，不自动决定作者资格和顺序</div>`
};
if(id==='cover')document.body.classList.add('cover');
document.getElementById('canvas').innerHTML=cards[id];
</script>
