<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="style.css"></head><body><main class="canvas"><span class="badge">给 AI 的检索合同</span><h2>不要只要“综述”，要这些可审计字段</h2><div class="row"><div class="card blue col"><div class="title">检索层</div><div class="pill">query 完整查询式</div><div class="pill">retrieved_at 检索日期</div><div class="pill">database = PubMed</div></div><div class="card green col"><div class="title">记录层</div><div class="pill">PMID（必填）</div><div class="pill">DOI（有则填，无则空）</div><div class="pill">题名 / 年份 / 期刊</div></div><div class="card red col"><div class="title">判断层</div><div class="pill">supports</div><div class="pill">does_not_support</div><div class="pill">仅凭摘要无法判断</div></div></div><div class="footer"><span>没有检索到来源，就不要配造引用</span><span>证据边界也要输出</span></div></main></body></html>
