<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>捕获-再捕获研究解读卡片</title>
  <style>
    :root{--ink:#17324d;--blue:#2f6fed;--pale:#eef5ff;--line:#cbdcf3;--muted:#66788a;--red:#e95b62;--green:#269b7b;--gold:#d59b2d}
    *{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#f7fbff;color:var(--ink);font-family:"PingFang SC","Hiragino Sans GB",sans-serif}
    body.cover{width:1200px;height:510px}body.card{width:1440px;height:810px}
    .canvas{width:100%;height:100%;position:relative;padding:60px 76px;background:linear-gradient(135deg,#f9fcff 0%,#eaf3ff 100%)}
    .canvas:before{content:"";position:absolute;inset:24px;border:1px solid var(--line);border-radius:28px;pointer-events:none}
    .kicker{font:600 21px/1.2 "SF Mono",Menlo,monospace;letter-spacing:2px;color:var(--blue);text-transform:uppercase}
    h1{margin:17px 0 0;font-size:68px;line-height:1.13;letter-spacing:-2px;max-width:1180px}.cover h1{font-size:69px;max-width:900px}.accent{color:var(--blue)}
    .subtitle{margin-top:20px;font-size:29px;line-height:1.5;color:#40566b}
    .footer{position:absolute;left:76px;right:76px;bottom:45px;display:flex;justify-content:space-between;font:500 18px/1.4 "SF Mono",Menlo,monospace;color:var(--muted)}
    .dots{position:absolute;right:78px;top:70px;width:215px;height:150px;background-image:radial-gradient(#9dbbe7 2px,transparent 2px);background-size:18px 18px;opacity:.55}
    .source-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;margin-top:38px}.source{background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;text-align:center;box-shadow:0 14px 30px rgba(36,83,135,.06)}.source .icon{width:64px;height:64px;border-radius:50%;margin:0 auto 16px;display:grid;place-items:center;color:#fff;background:var(--blue);font-size:28px;font-weight:760}.source:nth-child(2) .icon{background:var(--green)}.source:nth-child(3) .icon{background:var(--gold)}.source h2{font-size:30px;margin:0}.source p{font-size:21px;color:var(--muted);margin:10px 0 0}.unseen{margin-top:25px;background:#fff4f4;border:1px solid #f2c4c7;border-radius:18px;padding:20px 28px;text-align:center;font-size:29px;font-weight:700;color:#9d3439}.unseen span{font-weight:500;font-size:22px;color:#735257;margin-left:16px}
    .equation{display:grid;grid-template-columns:1fr 72px 1fr 72px 1fr;align-items:stretch;gap:16px;margin-top:42px}.metric{background:#fff;border:1px solid var(--line);border-radius:24px;padding:30px 24px;text-align:center}.metric .num{font-size:62px;font-weight:780;color:var(--blue);line-height:1}.metric.red .num{color:var(--red)}.metric.green .num{color:var(--green)}.metric .label{font-size:24px;margin-top:15px}.op{display:grid;place-items:center;font-size:54px;font-weight:760;color:var(--muted)}.completeness{margin-top:28px;background:var(--ink);color:white;border-radius:20px;padding:20px 28px;display:flex;align-items:center;justify-content:center;gap:22px;font-size:27px}.completeness strong{font-size:50px;color:#83adff}.completeness small{font-size:20px;color:#c8d5e2}
    .check-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}.check{background:#fff;border:1px solid var(--line);border-radius:20px;padding:21px 27px;min-height:174px}.check h2{margin:0 0 11px;font-size:27px;color:var(--blue)}.check p{margin:0;font-size:21px;line-height:1.5;color:#40566b}.check b{color:var(--ink)}.check .conflict{color:var(--red);font-weight:700}
  </style>
</head>
<body>
  <div id="app"></div>
  <script>
    const q=new URLSearchParams(location.search);const card=q.get('card')||'cover';const app=document.getElementById('app');document.body.className=card==='cover'?'cover':'card';
    const foot='<div class="footer"><span>普癌新声 · 肿瘤登记文献解读</span><span>Mohammadi et al. · 2016</span></div>';
    if(card==='cover')app.innerHTML=`<main class="canvas cover"><div class="dots"></div><div class="kicker">CANCER REGISTRY COMPLETENESS</div><h1>漏报的癌症病例<br><span class="accent">怎样估计？</span></h1><div class="subtitle">三源捕获-再捕获研究解读</div>${foot}</main>`;
    if(card==='sources')app.innerHTML=`<main class="canvas"><div class="kicker">THREE-SOURCE CAPTURE–RECAPTURE</div><h1>三份名单，估计一个<span class="accent">不可见单元</span></h1><div class="source-grid"><section class="source"><div class="icon">P</div><h2>病理报告</h2><p>Pathology</p></section><section class="source"><div class="icon">H</div><h2>住院记录</h2><p>Hospital</p></section><section class="source"><div class="icon">D</div><h2>死亡登记</h2><p>Death registry</p></section></div><div class="unseen">三源均未出现的病例 <span>利用7种可观察重叠组合进行模型估计</span></div>${foot}</main>`;
    if(card==='estimate')app.innerHTML=`<main class="canvas"><div class="kicker">FIVE PROVINCES · GI CANCERS · 2008–2010</div><h1>从观察病例到<span class="accent">完整性估计</span></h1><div class="equation"><section class="metric"><div class="num">9,574</div><div class="label">观察到的病例</div></section><div class="op">+</div><section class="metric red"><div class="num">4,888.7</div><div class="label">模型估计未捕获</div></section><div class="op">=</div><section class="metric green"><div class="num">14,462.7</div><div class="label">估计病例总数</div></section></div><div class="completeness"><span>登记完整性</span><strong>66.2%</strong><small>95%CI（估计总数）13,434.9—15,764.2</small></div>${foot}</main>`;
    if(card==='checks')app.innerHTML=`<main class="canvas"><div class="kicker">READ TABLES BEFORE QUOTING</div><h1>引用前，先核对<span class="accent">四处不一致</span></h1><div class="check-grid"><section class="check"><h2>性别方向</h2><p><b>表3：</b>男性71.1% ＞ 女性59.9%<br><span class="conflict">正文却写女性高于男性</span></p></section><section class="check"><h2>低年龄组</h2><p><b>摘要/表3：</b>40岁以下38.1%<br><span class="conflict">正文/讨论写31.8%</span></p></section><section class="check"><h2>研究期</h2><p><b>表与图：</b>2008—2010年<br><span class="conflict">方法另写2008.3—2011.3</span></p></section><section class="check"><h2>结局范围</h2><p><b>核心模型：</b>胃肠道癌<br><span class="conflict">摘要另称全部癌症漏报49%</span></p></section></div>${foot}</main>`;
  </script>
</body>
</html>
