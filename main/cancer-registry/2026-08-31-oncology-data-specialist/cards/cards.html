<html lang="zh-CN"><head><meta charset="utf-8"><title>ODS-C 排版卡</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:1440px;height:810px;overflow:hidden}body{font-family:"PingFang SC","Hiragino Sans GB",sans-serif;color:#0b1530;background:#fff}.canvas{width:100%;height:100%;padding:56px 70px;display:flex;flex-direction:column;position:relative;background-color:#fff;background-image:linear-gradient(#e7ecff 1px,transparent 1px),linear-gradient(90deg,#e7ecff 1px,transparent 1px);background-size:36px 36px}.canvas:before{content:"";position:absolute;inset:25px;border:3px solid #2e3a5e;border-radius:25px;pointer-events:none}.kicker{font:800 21px "SF Mono",Menlo,monospace;color:#4a6cf7;letter-spacing:2px;margin-bottom:14px}.title{font-size:53px;line-height:1.15;font-weight:900;letter-spacing:-1px;position:relative}.title em{font-style:normal;color:#ff8c42}.sub{font-size:24px;line-height:1.5;color:#465171;margin-top:12px}.footer{margin-top:auto;font:700 18px "SF Mono",Menlo,monospace;color:#465171}.badge{position:absolute;right:82px;top:80px;width:200px;height:200px;border:10px solid #4a6cf7;border-radius:50%;background:#fff;display:grid;place-items:center;transform:rotate(7deg);box-shadow:16px 16px 0 #ffcfb1}.badge b{font:900 50px "SF Mono",Menlo,monospace;color:#0b1530}.flow{display:flex;align-items:center;gap:22px;margin-top:54px}.node{flex:1;background:#fff;border:4px solid #2e3a5e;border-radius:24px;padding:28px 24px;min-height:210px;box-shadow:10px 10px 0 #dfe5ff}.node.orange{box-shadow:10px 10px 0 #ffe1cb}.node h3{font-size:34px;margin:0 0 14px;color:#0b1530}.node p{font-size:22px;line-height:1.5;margin:0;color:#465171}.arrow{font-size:56px;color:#4a6cf7;font-weight:900}.note{margin-top:30px;background:#fff6ee;border-left:8px solid #ff8c42;border-radius:10px;padding:17px 22px;font-size:23px;font-weight:700;color:#6f3c18}.routes{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:28px}.route{background:#fff;border:4px solid #2e3a5e;border-radius:24px;padding:22px;min-height:390px;box-shadow:9px 9px 0 #dfe5ff}.route:nt <script>
const id=new URLSearchParams(location.search).get('card')||'cover';
const cards={
cover:`<div class="kicker">CANCER REGISTRY CAREER</div><div class="title">ODS-C 报考指南<br><em>肿瘤数据专员</em></div><div class="sub">美国肿瘤登记职业认证 · 报考资格 · 考试内容 · 薪资参考</div><div class="badge"><b>ODS-C</b></div><div class="footer">普癌新声 · 依据 NCRA 2026 官方资料</div>`,
name:`<div class="kicker">NAME CHANGE · 2024-01-01</div><div class="title">名称变了，专业核心<em>没变</em></div><div class="flow"><div class="node"><h3>CTR</h3><p>Certified Tumor Registrar<br>原证书名称</p></div><div class="arrow">→</div><div class="node orange"><h3>ODS / ODS-C</h3><p>Oncology Data Specialist<br>现行证书名称</p></div></div><div class="note">NCRA：ODS 是认证名称，不是统一的岗位名称；职业群体仍称 cancer registrar。</div><div class="footer">SOURCE · NCRA ODS Toolkit</div>`,
routes:`<div class="kicker">报考路径 · 2026</div><div class="title">成为 ODS-C 的<em>三条路径</em></div><div class="routes"><div class="route"><div class="tag">路径1</div><h3>认可副学士项目</h3><ul><li>NCRA 认可的肿瘤登记管理副学士</li><li>完成实习</li><li>完成核心在线能力评估</li></ul></div><div class="route"><div class="tag">路径2</div><h3>已有学历 + 认可证书</h3><ul><li>副学士或等同 60 学分</li><li>NCRA 认可的肿瘤登记管理证书</li><li>完成实习</li></ul></div><div class="route"><div class="tag">路径3</div><h3>学历 + 登记经验</h3><ul><li>副学士或等同 60 学分</li><li>2 学期解剖与生理</li><li>1,950 小时登记工作经验</li></ul></div></div><div class="footer">境外学历与经验是否符合，以 NCRA 个案审核为准 · SOURCE: 2026 Exam Handbook</div>`,
exam:`<div class="kicker">EXAM BLUEPRINT · 180 ITEMS</div><div class="title">ODS 考试的<em>四个能力领域</em></div><div class="domains"><div class="domain"><div class="n">30</div><div><h3>法律与伦理</h3><p>隐私、信息释放、报告要求</p></div><div class="mode">闭卷</div></div><div class="domain"><div class="n">45</div><div><h3>肿瘤登记运行</h3><p>登记类型、病例发现、质量控制</p></div><div class="mode">闭卷</div></div><div class="domain"><div class="n">45</div><div><h3>登记数据识别</h3><p>医学术语、病理、诊疗与可报性</p></div><div class="mode">闭卷</div></div><div class="domain open"><div class="n">60</div><div><h3>编码与摘录</h3><p>Solid Tumor Rules、分期、治疗编码</p></div><div class="mode">开卷</div></div></div><div class="summary"><div class="pill">4 小时</div><div class="pill">120 题闭卷</div><div class="pill">60 题开卷</div><div class="pill">仅英语</div></div><div class="footer">SOURCE · NCRA 2026 Exam Handbook & Content Outline</div>`
};
if(id==='cover')document.body.classList.add('cover');document.getElementById('canvas').innerHTML=cards[id];
if(id==='cover'){
  document.querySelector('.title').innerHTML='ODS-C 报考指南<br><em>肿瘤数据专员</em>';
  document.querySelector('.sub').textContent='美国肿瘤登记职业认证 · 报考资格 · 考试内容 · 薪资参考';
}
if(id==='routes')document.querySelector('.kicker').textContent='报考路径 · 2026';
</script></body></html>
