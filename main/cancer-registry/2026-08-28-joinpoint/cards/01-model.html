<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="card.css"><style>html,body{width:1440px;height:810px}</style></head><body><div class="canvas"><div class="grid"></div><div class="content"><div class="kicker"><span class="dot"></span>01 / MODEL</div><div class="title">Joinpoint找的是<span class="accent">斜率改变</span></div><div class="subtitle">线段保持连续，连接点前后的变化速度不同</div><div class="model-row"><div class="panel"><div class="formula">E(y | x) = β₀ + β₁x<br>+ Σ δⱼ(x - τⱼ)₊</div><div class="note">τⱼ：未知连接点<br>δⱼ：连接点后的斜率改变量</div></div><div class="panel"><svg viewBox="0 0 540 300" width="100%"><line x1="45" y1="255" x2="510" y2="255" stroke="#9fb3c8" stroke-width="3"/><line x1="45" y1="255" x2="45" y2="35" stroke="#9fb3c8" stroke-width="3"/><path d="M55 235 L190 195 L310 150 L390 70 L495 50" fill="none" stroke="#315d91" stroke-width="8" stroke-linecap="round"/><circle cx="310" cy="150" r="13" fill="#e47b4c"/><circle cx="390" cy="70" r="13" fill="#e47b4c"/><text x="285" y="185" font-size="24" fill="#c45f34">τ₁</text><text x="400" y="95" font-size="24" fill="#c45f34">τ₂</text><text x="85" y="205" font-size="22" fill="#52677f">APC₁</text><text x="235" y="150" font-size="22" fill="#52677f">APC₂</text><text x="420" y="47" font-size="22" fill="#52677f">APC₃</text></svg></div></div><div class="footer">来源：Kim et al., Statistics in Medicine, 2000</div></div></div></body></html>
