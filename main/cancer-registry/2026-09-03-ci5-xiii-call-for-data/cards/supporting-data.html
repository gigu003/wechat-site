<meta charset="utf-8">
<style>
html,body{width:1440px;height:810px;margin:0;overflow:hidden;background:#f7f9fc;color:#17233c;font-family:"PingFang SC","Helvetica Neue",sans-serif}.card{box-sizing:border-box;width:1440px;height:810px;padding:64px 78px;background:linear-gradient(135deg,#f7f9fc 0%,#eaf1ff 100%)}.kicker{font:700 20px/1 "SF Mono","Menlo",monospace;letter-spacing:2px;color:#4a6cf7}.title{font-size:48px;font-weight:700;margin-top:30px}.rule{width:90px;height:7px;background:#ff8c42;margin:24px 0 42px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:26px}.item{box-sizing:border-box;background:#fff;border:1px solid #dce5f7;padding:30px 28px;min-height:280px;box-shadow:0 8px 22px rgba(49,78,135,.06)}.num{font:700 24px "SF Mono","Menlo",monospace;color:#4a6cf7}.item h2{font-size:29px;margin:16px 0 14px}.item p{font-size:22px;line-height:1.6;margin:0;color:#52627f}.note{margin-top:34px;font-size:21px;color:#42516d}.footer{margin-top:28px;font:17px "SF Mono","Menlo",monospace;color:#71809a}

<body><div class="card"><div class="kicker">CI5-XIII · SUPPORTING DATA</div><div class="title">人口、死亡与人口寿命表</div><div class="rule"></div><div class="grid"><div class="item"><div class="num">01 / POPULATION</div><h2>人口数据</h2><p>年份—性别—年龄/年龄组—居民人数。</p></div><div class="item"><div class="num">02 / MORTALITY</div><h2>死亡数据</h2><p>年份—性别—年龄/年龄组—死因—死亡人数。</p></div><div class="item"><div class="num">03 / LIFE TABLE</div><h2>人口寿命表</h2><p>年份—性别—单岁年龄—全因死亡概率。</p></div></div><div class="note">三类资料应与病例数据的登记区域、时期、性别和年龄范围相匹配。</div><div class="footer">OFFICIAL SOURCES · REFERENCE PERIOD · CONSISTENT CODING</div></div></body>
