<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
html,body{width:1440px;height:810px;margin:0;overflow:hidden;background:#17233c;color:#f7f9fc;font-family:"PingFang SC","Helvetica Neue",sans-serif}.card{box-sizing:border-box;width:1440px;height:810px;padding:64px 78px;background:linear-gradient(135deg,#17233c,#263d68)}.kicker{font:700 20px/1 "SF Mono","Menlo",monospace;letter-spacing:2px;color:#8fa8ff}.title{font-size:48px;font-weight:700;margin-top:30px}.rule{width:90px;height:7px;background:#ff8c42;margin:24px 0 36px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:24px}.item{box-sizing:border-box;min-height:205px;border:1px solid rgba(255,255,255,.28);padding:28px 30px;background:rgba(255,255,255,.07)}.num{font:700 24px "SF Mono","Menlo",monospace;color:#ffb37d}.item h2{font-size:28px;margin:12px 0 10px}.item p{font-size:22px;line-height:1.55;color:#dbe5ff;margin:0}.footer{margin-top:34px;font:17px "SF Mono","Menlo",monospace;color:#9fb0d3}
</style>
</head>
<body><div class="card"><div class="kicker">CI5-XIII · INCIDENCE DATA</div><div class="title">发病数据：每行一个病例</div><div class="rule"></div><div class="grid"><div class="item"><div class="num">01 / IDENTITY</div><h2>基本识别信息</h2><p>患者识别号、肿瘤序号、出生日期、性别和发病日期。</p></div><div class="item"><div class="num">02 / AGE</div><h2>年龄与肿瘤编码</h2><p>年龄，以及 ICD-O-3 解剖部位、形态学和行为编码。</p></div><div class="item"><div class="num">03 / DIAGNOSIS</div><h2>诊断依据</h2><p>按协议代码记录诊断依据；本地差异写入 coding file。</p></div><div class="item"><div class="num">04 / OPTIONAL</div><h2>可选扩展字段</h2><p>生存状态、末次联系日期、TNM 分期和版本可按授权提交。</p></div></div><div class="footer">2018—2022 · ALL AGES · ONE CASE PER LINE</div></div></body>
</html>
