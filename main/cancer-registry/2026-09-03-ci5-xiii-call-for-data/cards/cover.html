<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<style>
html,body{width:1200px;height:510px;margin:0;overflow:hidden;background:#f7f9fc;color:#17233c;font-family:"PingFang SC","Helvetica Neue",sans-serif}
.card{box-sizing:border-box;width:1200px;height:510px;padding:56px 76px;position:relative;background:linear-gradient(135deg,#f7f9fc 0%,#eaf1ff 100%)}
.kicker{font:700 20px/1 "SF Mono","Menlo",monospace;letter-spacing:2px;color:#4a6cf7;text-transform:uppercase}
h1{font-size:58px;line-height:1.12;margin:34px 0 20px;letter-spacing:1px}
.accent{color:#4a6cf7}
.sub{font-size:28px;color:#42516d;margin-top:8px}
.deadline{position:absolute;right:76px;bottom:68px;padding:18px 24px;border-left:6px solid #ff8c42;background:#fff;font-size:27px;font-weight:700;color:#253553;box-shadow:0 10px 28px rgba(49,78,135,.10)}
.circle{position:absolute;right:74px;top:54px;width:180px;height:180px;border:2px solid #c4d2f5;border-radius:50%}
.circle:before,.circle:after{content:"";position:absolute;border:2px solid #c4d2f5;border-radius:50%}
.circle:before{inset:24px}.circle:after{inset:48px}
.footer{position:absolute;left:76px;bottom:34px;font:16px "SF Mono","Menlo",monospace;color:#71809a}
</style>
</head>
<body><div class="card"><div class="kicker">IACR / IARC · CALL FOR DATA</div><h1>五大洲癌症发病率<br><span class="accent">第十三卷（CI5-XIII）</span></h1><div class="sub">倡议全球肿瘤登记处提交 2018—2022 年登记数据</div><div class="deadline">截止：2026年11月30日</div><div class="circle"></div><div class="footer">CANCER INCIDENCE IN FIVE CONTINENTS · VOLUME XIII</div></div></body>
</html>
