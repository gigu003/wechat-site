<body><div class="card"><div class="kicker">CI5-XIII · SUBMISSION CHECKLIST</div><div class="title">完整提交 = 数据集 + 在线调查问卷</div><div class="rule"></div><div class="grid"><div class="item"><div class="num">01</div><h2>发病数据</h2><p>以个案记录形式提交；每行一个病例。</p></div><div class="item"><div class="num">02</div><h2>人口数据</h2><p>官方普查或人口估计；与病例资料匹配。</p></div><div class="item"><div class="num">03</div><h2>死亡数据</h2><p>有可用资料时提供，优先使用官方生命统计资料。</p></div><div class="item"><div class="num">04</div><h2>人口寿命表</h2><p>有可用资料时提供，并注明资料来源。</p></div><div class="item"><div class="num">05</div><h2>Coding file</h2><p>说明本地编码、覆盖范围、人口估计方法和特殊代码。</p></div><div class="item"><div class="num">06</div><h2>在线调查问卷</h2><p>填写登记处、覆盖人口和目标时期等信息。</p></div></div><div class="footer">CI5-XIII · 2018—2022 · DEADLINE 30 NOV 2026</div></div></body>
